<div id="form-container" style="max-width: 400px; font-family: sans-serif;">
  <form id="contact-form">
     <input type="text" id="name" name="name" placeholder="Όνομα" required style="width:100%; margin-bottom:10px; padding:8px;">
     <input type="email" id="email" name="email" placeholder="Email" required style="width:100%; margin-bottom:10px; padding:8px;">
     <textarea id="message" name="message" placeholder="Μήνυμα" required style="width:100%; height:100px; margin-bottom:10px; padding:8px;"></textarea>
     
     <button type="submit" id="submit-btn" style="background: #007BFF; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px;">
        Αποστολή
     </button>
  </form>
  
  <div id="status-msg" style="display:none; color: green; font-weight: bold; margin-top: 10px; padding: 10px; border: 1px solid green;">
     Το μήνυμα στάλθηκε επιτυχώς!
  </div>
</div>

<script>
  const contactForm = document.getElementById('contact-form');
  const statusMsg = document.getElementById('status-msg');
  const submitBtn = document.getElementById('submit-btn');

  contactForm.addEventListener("submit", function(e) {
    e.preventDefault();
    
    submitBtn.innerText = "Αποστολή...";
    submitBtn.disabled = true;

    const data = new FormData(contactForm);
    
    fetch("https://formsubmit.co/ajax/radiochta@gmail.com", {
      method: "POST",
      body: data
    })
    .then(response => {
      if (response.ok) {
        // 1. Εμφάνισε το μήνυμα επιτυχίας
        statusMsg.style.display = 'block';
        // 2. Καθάρισε τα πεδία της φόρμας
        contactForm.reset();
        // 3. Επαναφορά κουμπιού
        submitBtn.innerText = "Αποστολή";
        submitBtn.disabled = false;
        
        // 4. Εξαφάνισε το μήνυμα "Εστάλη" μετά από 5 δευτερόλεπτα
        setTimeout(() => {
          statusMsg.style.display = 'none';
        }, 5000);
      } else {
        alert("Κάτι πήγε στραβά.");
        submitBtn.disabled = false;
      }
    })
    .catch(error => {
      alert("Σφάλμα σύνδεσης.");
      submitBtn.disabled = false;
    });
  });
</script>
