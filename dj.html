<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Live Streaming Multi-Server Fullscreen</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }
    #playerContainer {
      position: relative;
      width: 100%; height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    video::-webkit-media-controls { display:none !important; }
    
    #loadingOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: white;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 6px solid #ffffff;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .controls {
      position: absolute;
      bottom: 20px; right: 20px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .control-btn {
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px; height: 45px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      transition: 0.3s;
    }
    .control-btn:hover { background: rgba(255,255,255,0.3); }

    #statusMessage {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 8px;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="playerContainer">
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText" style="font-size: 18px;">Φόρτωση live streaming...</div>
  </div>

  <video id="player" autoplay muted playsinline></video>
  
  <div id="statusMessage">🔄 Έλεγχος σύνδεσης…</div>
  
  <div class="controls">
    <button id="unmuteBtn" class="control-btn" title="Ήχος">🔇</button>
    <button id="fullscreenBtn" class="control-btn" title="Πλήρης οθόνη">⛶</button>
  </div>
</div>

<script>
const mainServers = [
  "https://live20.bozztv.com/akamaissh101/ssh101/radiotvtrela/playlist.m3u8",
  "https://edge1-eu-west.picarto.tv/stream/golive%2bzakynthos.mp4"
];
const fallbackUrl = "https://stream.gumlet.io/67a9d3a3feefe705cbda86f6/68023cd93f934d7b33b9ecc7/main.m3u8";

const video = document.getElementById("player");
const container = document.getElementById("playerContainer");
const unmuteBtn = document.getElementById("unmuteBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const statusMessage = document.getElementById("statusMessage");
const loadingOverlay = document.getElementById("loadingOverlay");
const loadingText = document.getElementById("loadingText");

let hls = null;
let currentActiveUrl = ""; 
let testingLive = false;
let isSwitching = false;

// Μεταβλητές για τον έλεγχο παγώματος
let lastPlayPos = 0;
let checkInterval = null;

// WATCHDOG: Ελέγχει αν η εικόνα προχωράει
function startWatchdog() {
    stopWatchdog();
    checkInterval = setInterval(() => {
        // Αν παίζει το Live και η ώρα του βίντεο είναι ίδια με πριν
        if (currentActiveUrl !== fallbackUrl && currentActiveUrl !== "" && !video.paused) {
            if (video.currentTime === lastPlayPos) {
                console.log("Ανιχνεύθηκε πάγωμα εικόνας. Αλλαγή σε backup...");
                currentActiveUrl = "";
                stopWatchdog();
                updateStream();
            }
            lastPlayPos = video.currentTime;
        }
    }, 3000); // Έλεγχος κάθε 3 δευτερόλεπτα
}

function stopWatchdog() {
    if (checkInterval) clearInterval(checkInterval);
}

fullscreenBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => {
      alert(`Σφάλμα: ${err.message}`);
    });
    fullscreenBtn.textContent = "✖";
  } else {
    document.exitFullscreen();
    fullscreenBtn.textContent = "⛶";
  }
});

function playStream(url) {
  if (currentActiveUrl === url && video.readyState >= 3) return;

  if (currentActiveUrl !== "" && currentActiveUrl !== fallbackUrl && url === fallbackUrl) {
    showOverlay("Το Live Stream τελείωσε", 3000);
  } 
  else if (url !== fallbackUrl) {
    showOverlay("Φόρτωση live streaming...", 0);
  }

  currentActiveUrl = url;

  if (hls) {
    hls.detachMedia();
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute('src');
  video.load();

  if (Hls.isSupported() && url.includes("m3u8")) {
    hls = new Hls({ manifestLoadingRetryDelay: 1000, manifestLoadingMaxRetry: 6 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { 
      video.play().then(() => {
        if (loadingText.textContent !== "Το Live Stream τελείωσε") {
          loadingOverlay.style.display = "none";
        }
        startWatchdog();
      }).catch(() => {
        loadingOverlay.style.display = "none";
      }); 
    });
    hls.on(Hls.Events.ERROR, (event, data) => { 
      if (data.fatal) {
        currentActiveUrl = "";
        updateStream(); 
      }
    });
  } 
  else {
    video.src = url;
    video.play().then(() => {
        if (loadingText.textContent !== "Το Live Stream τελείωσε") {
          loadingOverlay.style.display = "none";
        }
        startWatchdog();
    }).catch(() => {
        loadingOverlay.style.display = "none";
    });
  }
}

function showOverlay(text, duration) {
  loadingText.textContent = text;
  loadingOverlay.style.display = "flex";
  if (duration > 0) {
    isSwitching = true;
    setTimeout(() => {
      loadingOverlay.style.display = "none";
      isSwitching = false;
    }, duration);
  }
}

function checkUrl(url) {
  return new Promise((resolve) => {
    let tempVideo = document.createElement("video");
    tempVideo.muted = true;
    let finished = false;

    let timeout = setTimeout(() => {
      if (!finished) {
        finished = true;
        tempVideo.pause();
        tempVideo.src = "";
        tempVideo.load();
        tempVideo.remove();
        resolve(false);
      }
    }, 7000);

    tempVideo.onplaying = () => {
      if (!finished) {
        finished = true;
        clearTimeout(timeout);
        tempVideo.pause();
        tempVideo.src = "";
        tempVideo.load();
        tempVideo.remove();
        resolve(true);
      }
    };

    tempVideo.onerror = () => {
      if (!finished) {
        finished = true;
        clearTimeout(timeout);
        tempVideo.pause();
        tempVideo.src = "";
        tempVideo.load();
        tempVideo.remove();
        resolve(false);
      }
    };

    tempVideo.src = url;
    tempVideo.play().catch(() => {});
  });
}

async function updateStream() {
  if (testingLive || isSwitching) return;
  testingLive = true;
  let foundLiveUrl = null;

  for (let url of mainServers) {
    const isOk = await checkUrl(url);
    if (isOk) { foundLiveUrl = url; break; }
  }

  if (foundLiveUrl) {
    statusMessage.textContent = "🔴 Ζωντανά τώρα";
    playStream(foundLiveUrl);
  } else {
    statusMessage.textContent = "🎬 Παρακολουθείτε video clip";
    playStream(fallbackUrl);
  }
  testingLive = false;
}

unmuteBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  unmuteBtn.textContent = video.muted ? "🔇" : "🔊";
});

updateStream();
setInterval(() => updateStream(), 20000);
</script>

</body>
</html>
