<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Radio Sync FINAL</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { border: 2px solid #333; padding: 30px; border-radius: 15px; display: inline-block; background: #111; }
        #counter { font-size: 60px; color: #00ff00; }
        .status { margin-top: 15px; color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <div>ΑΚΡΟΑΤΕΣ ONLINE</div>
        <div id="counter">0</div>
        
        <audio id="player" controls autoplay>
            <source src="https://radio.nitro-server.uk/listen/radiotrela/radio.mp3" type="audio/mpeg">
        </audio>

        <div id="msg" class="status">Αναμονή...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        const audio = document.getElementById('player');
        const counterDisplay = document.getElementById('counter');
        const msg = document.getElementById('msg');

        const link1 = "https://radio.nitro-server.uk/listen/radiotrela/radio.mp3";
        const link2 = "https://stream.zeno.fm/x8gduy6xd48uv";

        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const radio = gun.get('radiotrela_final_v1');

        const myId = 'u_' + Math.random().toString(36).substr(2, 9);

        // 1. Καταγραφή χρήστη
        radio.get('users').get(myId).put(true);
        window.onbeforeunload = () => radio.get('users').get(myId).put(null);

        // 2. Μηχανισμός Μετρητή και Απόφασης
        radio.get('users').map().on(function() {
            radio.get('users').once(function(all) {
                let total = 0;
                for(let key in all) { if(all[key] === true) total++; }
                
                counterDisplay.innerText = total;

                // Ο 1ος χρήστης που θα δει το 3, θα "ρίξει" τον παγκόσμιο διακόπτη
                if (total >= 3) {
                    radio.get('switch').put({ active: true });
                } else {
                    radio.get('switch').put({ active: false });
                }
            });
        });

        // 3. Ο ΠΑΓΚΟΣΜΙΟΣ ΔΙΑΚΟΠΤΗΣ (Αυτόν "ακούνε" όλοι οι browsers)
        radio.get('switch').on(function(data) {
            if (data.active === true) {
                if (audio.src !== link2) {
                    console.log("Εντολή αλλαγής ελήφθη!");
                    audio.src = link2;
                    audio.load(); // Αναγκάζει τον browser να ξαναφορτώσει το νέο link
                    audio.play().catch(e => console.log("Περιμένω κλικ του χρήστη για ήχο"));
                    msg.innerText = "LIVE: ZENO FM";
                    msg.style.color = "red";
                }
            } else {
                if (audio.src !== link1) {
                    audio.src = link1;
                    audio.load();
                    audio.play();
                    msg.innerText = "Αναμονή για 3 άτομα...";
                    msg.style.color = "#f39c12";
                }
            }
        });
    </script>
</body>
</html>
