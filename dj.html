<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Radio Live Switcher - Global</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #333; padding: 40px; border-radius: 20px; display: inline-block; background: #111; }
        #count { font-size: 50px; color: #00ff00; display: block; }
        .status { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #aaa; }
        audio { margin-top: 30px; filter: invert(100%); }
    </style>
</head>
<body>

    <div class="box">
        <span id="count">0</span>
        <div style="font-size: 14px; color: #666;">ΑΚΡΟΑΤΕΣ ONLINE</div>

        <audio id="player" controls autoplay>
            <source src="https://radio.nitro-server.uk/listen/radiotrela/radio.mp3" type="audio/mpeg">
        </audio>

        <div id="msg" class="status">Παίζει: Link 1 (Nitro)</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        const audio = document.getElementById('player');
        const countDisplay = document.getElementById('count');
        const msg = document.getElementById('msg');
        
        const l1 = "https://radio.nitro-server.uk/listen/radiotrela/radio.mp3";
        const l2 = "https://stream.zeno.fm/x8gduy6xd48uv";

        // Σύνδεση σε δημόσιο relay server
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const liveStatus = gun.get('radiotrela_12345').get('users');

        // Δημιουργία τυχαίου ID για κάθε χρήστη που μπαίνει
        const myId = 'user_' + Math.random().toString(36).substr(2, 9);

        // Δηλώνουμε ότι είμαστε Online
        liveStatus.get(myId).put(true);

        // Όταν κάποιος κλείνει το tab, σβήνεται από τη λίστα
        window.addEventListener('beforeunload', () => {
            liveStatus.get(myId).put(null);
        });

        // Παρακολούθηση αλλαγών (Πραγματικός Χρόνος)
        liveStatus.map().on((val, id) => {
            // Μόλις αλλάξει κάτι, μετράμε πόσοι είναι true
            liveStatus.once((data) => {
                let total = 0;
                for(let key in data) {
                    if(data[key] === true) total++;
                }
                
                countDisplay.innerText = total;

                // Η ΑΛΛΑΓΗ ΣΤΑ 10 ΑΤΟΜΑ
                if (total >= 10) {
                    if (audio.src !== l2) {
                        audio.src = l2;
                        audio.play();
                        msg.innerText = "ΑΛΛΑΓΗ: Παίζει το Link 2 (Zeno)";
                        msg.style.color = "#ff0000";
                    }
                } else {
                    if (audio.src !== l1) {
                        audio.src = l1;
                        audio.play();
                        msg.innerText = "Παίζει: Link 1 (Nitro)";
                        msg.style.color = "#aaa";
                    }
                }
            });
        });
    </script>
</body>
</html>
