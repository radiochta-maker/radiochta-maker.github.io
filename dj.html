<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Radio Sync Test (3 Users)</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .stat-box { background: #1a1a1a; padding: 30px; border-radius: 20px; display: inline-block; border: 2px solid #333; }
        #counter { font-size: 70px; color: #00ff00; font-weight: bold; line-height: 1; }
        .label { color: #666; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .msg { margin-top: 20px; font-size: 1.1em; color: #f39c12; min-height: 1.5em; }
        audio { margin-top: 25px; width: 300px; }
    </style>
</head>
<body>

    <div class="stat-box">
        <div class="label">Ακροατές αυτή τη στιγμή</div>
        <div id="counter">0</div>
        
        <audio id="radio" controls autoplay>
            <source src="https://radio.nitro-server.uk/listen/radiotrela/radio.mp3" type="audio/mpeg">
        </audio>

        <div id="status" class="msg">Περιμένοντας σύνδεση...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        const audio = document.getElementById('radio');
        const counter = document.getElementById('counter');
        const status = document.getElementById('status');

        const link1 = "https://radio.nitro-server.uk/listen/radiotrela/radio.mp3";
        const link2 = "https://stream.zeno.fm/x8gduy6xd48uv";

        // Σύνδεση στη βάση (Χρησιμοποιούμε ένα μοναδικό κλειδί 'radiotrela_test_room')
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const radioApp = gun.get('radiotrela_test_room_33');

        // Κάθε φορά που ανοίγεις tab, δημιουργείται νέο ID για το τεστ
        const myTabId = 'user_' + Math.random().toString(36).substr(2, 9);

        // Μπαίνουμε live
        radioApp.get('listeners').get(myTabId).put(true);

        // Βγαίνουμε όταν κλείσει το tab
        window.addEventListener('beforeunload', function() {
            radioApp.get('listeners').get(myTabId).put(null);
        });

        // Έλεγχος σε πραγματικό χρόνο
        radioApp.get('listeners').map().on(function(data, id) {
            radioApp.get('listeners').once(function(all) {
                let total = 0;
                for(let key in all) {
                    if(all[key] === true) total++;
                }

                counter.innerText = total;

                // ΕΔΩ ΕΙΝΑΙ Η ΡΥΘΜΙΣΗ ΓΙΑ ΤΑ 3 ΑΤΟΜΑ
                if (total >= 3) {
                    if (audio.src !== link2) {
                        audio.src = link2;
                        audio.play();
                        status.innerText = "ΟΡΙΟ 3 ΑΤΟΜΩΝ: Παίζει το Zeno FM!";
                        status.style.color = "#ff4d4d";
                    }
                } else {
                    if (audio.src !== link1) {
                        audio.src = link1;
                        audio.play();
                        status.innerText = "ΑΝΑΜΟΝΗ: Χρειάζονται 3 άτομα για αλλαγή...";
                        status.style.color = "#f39c12";
                    }
                }
            });
        });
    </script>
</body>
</html>
