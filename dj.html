<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Live Streaming Multi-Server</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
    }
    #playerContainer {
      position: relative;
      width: 100%; height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    video::-webkit-media-controls { display:none !important; }
    
    .controls {
      position: absolute;
      bottom: 20px; right: 20px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .control-btn {
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px; height: 45px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }
    #statusMessage {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 14px;
      font-size: 16px;
      border-radius: 8px;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="playerContainer">
  <video id="player" autoplay muted playsinline></video>
  <div id="statusMessage">🔄 Έλεγχος σύνδεσης…</div>
  <div class="controls">
    <button id="unmuteBtn" class="control-btn">🔇</button>
    <button id="fullscreenBtn" class="control-btn">⛶</button>
  </div>
</div>

<script>
const mainServers = [
  "https://live20.bozztv.com/akamaissh101/ssh101/radiotvtrela/playlist.m3u8",
  "https://edge1-eu-west.picarto.tv/stream/golive%2bzakynthos.mp4"
];
const fallbackUrl = "https://stream.gumlet.io/67a9d3a3feefe705cbda86f6/68023cd93f934d7b33b9ecc7/main.m3u8";

const video = document.getElementById("player");
const container = document.getElementById("playerContainer");
const unmuteBtn = document.getElementById("unmuteBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const statusMessage = document.getElementById("statusMessage");

let hls = null;
let currentActiveUrl = ""; 
let testingLive = false;

// Fullscreen Logic
fullscreenBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => console.log(err));
    fullscreenBtn.textContent = "✖";
  } else {
    document.exitFullscreen();
    fullscreenBtn.textContent = "⛶";
  }
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) fullscreenBtn.textContent = "⛶";
});

function playStream(url) {
  if (currentActiveUrl === url) return;
  currentActiveUrl = url;

  if (hls) {
    hls.detachMedia();
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute('src');
  video.load();

  if (Hls.isSupported() && url.includes("m3u8")) {
    hls = new Hls({ manifestLoadingRetryDelay: 1000, manifestLoadingMaxRetry: 6 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (event, data) => { if (data.fatal) updateStream(); });
  } 
  else {
    video.src = url;
    video.play().catch(() => {});
  }
}

// ΝΕΑ ΜΕΘΟΔΟΣ ΕΛΕΓΧΟΥ (Χωρίς να γυρνάει το κυκλάκι στο tab)
async function checkUrl(url) {
  try {
    // Κάνουμε ένα γρήγορο αίτημα για να δούμε αν το αρχείο υπάρχει
    const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
    // Στα live streams με no-cors δεν μπορούμε να δούμε το status (0), 
    // οπότε χρησιμοποιούμε ένα μικρό fetch για τα πρώτα bytes
    const probe = await fetch(url, { method: 'GET', mode: 'no-cors' });
    return true; 
  } catch (e) {
    return false;
  }
}

async function updateStream() {
  if (testingLive) return;
  testingLive = true;
  
  let foundLiveUrl = null;

  for (let url of mainServers) {
    // Χρησιμοποιούμε fetch probe αντί για video element
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        await fetch(url, { mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeoutId);
        foundLiveUrl = url;
        break;
    } catch (e) {
        // Συνέχισε στον επόμενο
    }
  }

  if (foundLiveUrl) {
    statusMessage.textContent = "🔴 Ζωντανά τώρα";
    playStream(foundLiveUrl);
  } else {
    statusMessage.textContent = "🎬 Παρακολουθείτε video clip";
    playStream(fallbackUrl);
  }
  testingLive = false;
}

unmuteBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  unmuteBtn.textContent = video.muted ? "🔇" : "🔊";
});

// Αρχική εκκίνηση
updateStream();
// Έλεγχος κάθε 30 δευτερόλεπτα
setInterval(() => updateStream(), 30000);
</script>

</body>
</html>
