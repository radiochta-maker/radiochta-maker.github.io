<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radio Player</title>
</head>
<body style="background:#000; color:#fff; text-align:center;">
    <h3>Radio Player</h3>
    <audio id="radio" controls autoplay src="https://radio.nitro-server.uk/listen/radiotrela/radio.mp3"></audio>
    
    <script>
        const audio = document.getElementById('radio');
        const link2 = "https://stream.zeno.fm/x8gduy6xd48uv";

        // Αντί για περίπλοκα συστήματα, βάλε αυτόν τον κώδικα 
        // να ελέγχει ΜΟΝΟ αν το δεύτερο link είναι ενεργό.
        // Μόλις εσύ ανοίξεις το Zeno, ο player θα γυρίσει εκεί.
        
        setInterval(function() {
            fetch(link2, { mode: 'no-cors' }).then(() => {
                if (audio.src !== link2) {
                    audio.src = link2;
                    audio.play();
                }
            });
        }, 5000);
    </script>
</body>
</html>
