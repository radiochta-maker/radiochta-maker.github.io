<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>radio live</title>

    <script src="jquery-3.2.1.min.js"></script>
    <script src="nativeflashradiov4.js"></script>


    <style>

        :root {

            --pink: #66ff33;
            --pink-light: #ff66dd;
            --white: #ffffff;

            --bg-overlay-opacity: 0;

            /* =========================================================
               PLAYER BACKGROUND - ΡΥΘΜΙΣΕ ΤΑ ΕΔΩ
               ---------------------------------------------------------
               Χρώμα: RGB τιμές (0-255)
               Διαφάνεια: 0 = τελείως διάφανο
                            1 = τελείως αδιαφανές
               ========================================================= */
            --player-bg-red: 0;
            --player-bg-green: 0;
            --player-bg-blue: 0;
            --player-bg-opacity: 0.40;

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            background: transparent !important;

            overflow: hidden;

        }


        /* =========================================================
           MAIN BODY OVERLAY
        ========================================================= */

        body::after {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color:
                rgba(
                    0,
                    0,
                    0,
                    var(--bg-overlay-opacity)
                );

            z-index: -1;

            pointer-events: none;

        }


        /* =========================================================
           RADIO PLAYER
        ========================================================= */

        .player-container {

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            position: relative;

        }


        /*
         * Το layer του player είναι πραγματικά ημιδιάφανο.
         * Το site από πίσω παραμένει ορατό.
         */
        #player {
            background: transparent !important;
        }

        #player::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(
                var(--player-bg-red),
                var(--player-bg-green),
                var(--player-bg-blue),
                var(--player-bg-opacity)
            );
            pointer-events: none;
            z-index: 0;
        }

        #player > * {
            position: relative;
            z-index: 1;
        }


        #player_texttitle,
        .playertexttitlespan {

            display: block !important;

            visibility: hidden;

            opacity: 0;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }


        #player_texttitle {

            font-size: 26px !important;

        }


        .playertexttitlespan {

            font-size: 34px !important;

            margin-top: 5px !important;

        }


        /* =========================================================
           PREMIUM RADIO INTRO
        ========================================================= */

        #startOverlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255, 51, 204, 0.18) 0%,
                    rgba(142, 45, 180, 0.14) 22%,
                    rgba(34, 12, 52, 0.82) 52%,
                    #09050f 100%
                );

            z-index: 100000;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 1s cubic-bezier(0.4, 0, 0.2, 1);
        }


        /* =========================================================
           AMBIENT LIGHT
        ========================================================= */

        #startOverlay::before {
            content: "";
            position: absolute;
            inset: -25%;

            background:
                radial-gradient(
                    ellipse at 18% 25%,
                    rgba(255, 51, 204, 0.17),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 82% 18%,
                    rgba(112, 72, 255, 0.14),
                    transparent 34%
                ),
                radial-gradient(
                    ellipse at 78% 82%,
                    rgba(255, 0, 153, 0.11),
                    transparent 36%
                ),
                radial-gradient(
                    ellipse at 15% 85%,
                    rgba(74, 25, 155, 0.13),
                    transparent 38%
                );

            filter: blur(55px);

            animation:
                ambientMove
                18s
                ease-in-out
                infinite
                alternate;

            pointer-events: none;
        }


        @keyframes ambientMove {
            0% {
                transform:
                    translate3d(-2%, -2%, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(3%, 2%, 0)
                    scale(1.05);
            }

            100% {
                transform:
                    translate3d(-1%, 4%, 0)
                    scale(1.02);
            }
        }


        /* =========================================================
           CINEMATIC VIGNETTE
        ========================================================= */

        #startOverlay::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(8, 3, 15, 0.08) 42%,
                    rgba(4, 1, 9, 0.50) 100%
                );

            box-shadow:
                inset 0 0 180px rgba(0, 0, 0, 0.55);

            pointer-events: none;
        }


        /* =========================================================
           HIDE INTRO
        ========================================================= */

        #startOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =========================================================
           CENTER GLOW
        ========================================================= */

        .intro-glow {
            position: absolute;

            width: 620px;
            height: 620px;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 51, 204, 0.18) 0%,
                    rgba(184, 45, 220, 0.10) 28%,
                    rgba(105, 40, 180, 0.04) 52%,
                    transparent 72%
                );

            border-radius: 50%;

            filter: blur(42px);

            animation:
                introGlow
                8s
                ease-in-out
                infinite;

            pointer-events: none;
        }


        @keyframes introGlow {
            0%,
            100% {
                transform:
                    scale(0.90)
                    translateY(0);

                opacity: 0.55;
            }

            50% {
                transform:
                    scale(1.10)
                    translateY(-14px);

                opacity: 0.95;
            }
        }


        /* =========================================================
           INTRO CONTENT
        ========================================================= */

        .intro-content {
            position: relative;
            z-index: 5;

            width:
                min(
                    90%,
                    520px
                );

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            font-family:
                'Unica One',
                Arial,
                sans-serif;

            /*
             * Η κλίμακα εξακολουθεί να ελέγχεται
             * από το υπάρχον JavaScript.
             */
            --intro-scale: 1;

            transform:
                scale(var(--intro-scale));

            transform-origin:
                center center;

            animation:
                introAppear
                1.15s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }


        @keyframes introAppear {
            from {
                opacity: 0;

                transform:
                    scale(
                        calc(
                            var(--intro-scale) * 0.94
                        )
                    )
                    translateY(24px);
            }

            to {
                opacity: 1;

                transform:
                    scale(var(--intro-scale))
                    translateY(0);
            }
        }


        /* =========================================================
           LOGO AREA
        ========================================================= */

        .intro-logo-wrapper {
            position: relative;

            width: 330px;
            height: 330px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 60px;
        }


        .intro-logo-wrapper::before {
            content: "";

            position: absolute;
            inset: 7px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 40px
                rgba(255, 51, 204, 0.08);
        }


        /* =========================================================
           ANIMATED LOGO RING
        ========================================================= */

        .intro-logo-ring {
            position: absolute;

            width: 100%;
            height: 100%;

            border:
                1px solid
                rgba(255, 51, 204, 0.32);

            border-radius: 50%;

            box-shadow:
                0 0 25px
                rgba(255, 51, 204, 0.06);

            animation:
                logoRing
                10s
                linear
                infinite;
        }


        .intro-logo-ring::before {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            background:
                var(--pink);

            border-radius: 50%;

            top: -3.5px;
            left: 50%;

            transform:
                translateX(-50%);

            box-shadow:
                0 0 8px var(--pink),
                0 0 20px var(--pink),
                0 0 38px rgba(255, 51, 204, 0.55);
        }


        @keyframes logoRing {
            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .intro-logo {
            position: relative;

            width: 300px;
            height: 300px;

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(255, 255, 255, 0.40)
                )
                drop-shadow(
                    0 0 35px
                    rgba(153, 255, 102, 0.12)
                );

            animation:
                logoFloat
                5s
                ease-in-out
                infinite;
        }


        @keyframes logoFloat {
            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-6px)
                    scale(1.015);
            }
        }


        /* =========================================================
           STATION NAME
        ========================================================= */

        .intro-station {
            position: relative;

            color:
                #99ff66;

            font-size: 36px;

            line-height: 1;

            letter-spacing: 7px;

            text-transform:
                uppercase;

            margin-bottom: 14px;

            padding-left: 7px;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.18),
                0 0 28px rgba(255, 51, 204, 0.22);
        }


        .intro-station::after {
            content: "";

            position: absolute;

            width: 55px;
            height: 1px;

            left: 50%;
            bottom: -9px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 51, 204, 0.75),
                    transparent
                );

            box-shadow:
                0 0 10px
                rgba(255, 51, 204, 0.35);
        }


        /* =========================================================
           LIVE BADGE
        ========================================================= */

        .intro-live {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            color:
                rgba(255, 255, 255, 0.70);

            font-size: 11px;

            letter-spacing: 4px;

            text-transform:
                uppercase;

            margin-top: 8px;
            margin-bottom: 38px;

            padding:
                7px 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.025);

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.12);

            backdrop-filter:
                blur(8px);
        }


        .intro-live-dot {
            width: 6px;
            height: 6px;

            background:
                var(--pink);

            border-radius: 50%;

            box-shadow:
                0 0 7px var(--pink),
                0 0 16px var(--pink);

            animation:
                livePulse
                1.5s
                ease-in-out
                infinite;
        }


        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;

                transform:
                    scale(1);
            }

            50% {
                opacity: 0.35;

                transform:
                    scale(0.65);
            }
        }


        /* =========================================================
           EQUALIZER
        ========================================================= */

        .intro-equalizer {
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            margin-bottom: 34px;

            padding:
                0 18px;
        }


        .eq-bar {
            width: 3px;

            background:
                linear-gradient(
                    to top,
                    rgba(255, 51, 204, 0.55),
                    rgba(255, 102, 221, 1)
                );

            border-radius: 10px;

            box-shadow:
                0 0 8px
                rgba(255, 51, 204, 0.35);

            animation:
                equalizer
                1s
                ease-in-out
                infinite;
        }


        .eq-bar:nth-child(1) {
            height: 14px;
            animation-delay: 0.10s;
        }

        .eq-bar:nth-child(2) {
            height: 27px;
            animation-delay: 0.25s;
        }

        .eq-bar:nth-child(3) {
            height: 38px;
            animation-delay: 0.05s;
        }

        .eq-bar:nth-child(4) {
            height: 22px;
            animation-delay: 0.35s;
        }

        .eq-bar:nth-child(5) {
            height: 34px;
            animation-delay: 0.15s;
        }

        .eq-bar:nth-child(6) {
            height: 18px;
            animation-delay: 0.40s;
        }

        .eq-bar:nth-child(7) {
            height: 30px;
            animation-delay: 0.20s;
        }

        .eq-bar:nth-child(8) {
            height: 15px;
            animation-delay: 0.30s;
        }


        @keyframes equalizer {
            0%,
            100% {
                transform:
                    scaleY(0.35);

                opacity: 0.35;
            }

            50% {
                transform:
                    scaleY(1);

                opacity: 1;
            }
        }


        /* =========================================================
           PLAY BUTTON
        ========================================================= */

        #startBtn {
            position: relative;

            width: 86px;
            height: 86px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 51, 204, 0.75);

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255, 255, 255, 0.10),
                    rgba(255, 51, 204, 0.12) 38%,
                    rgba(255, 51, 204, 0.025) 100%
                );

            color:
                #ffffff;

            cursor:
                pointer;

            display: flex;

            justify-content:
                center;

            align-items:
                center;

            font-size: 25px;

            padding-left: 5px;

            box-shadow:
                0 0 32px
                rgba(255, 51, 204, 0.45),
                0 0 60px
                rgba(255, 51, 204, 0.18),
                inset 0 0 25px
                rgba(255, 51, 204, 0.08);

            backdrop-filter:
                blur(10px);

            transition:
                transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.35s ease,
                background 0.35s ease;
        }


        #startBtn::before {
            content: "";

            position: absolute;

            inset: -12px;

            border:
                2px solid
                rgba(255, 51, 204, 0.55);

            border-radius: 50%;

            box-shadow:
                0 0 18px
                rgba(255, 51, 204, 0.40),
                0 0 36px
                rgba(255, 51, 204, 0.18);

            animation:
                playRing
                2.2s
                ease-out
                infinite;
        }


        #startBtn::after {
            content: "";

            position: absolute;

            inset: -22px;

            border:
                1.5px solid
                rgba(255, 51, 204, 0.28);

            border-radius: 50%;

            box-shadow:
                0 0 14px
                rgba(255, 51, 204, 0.22);

            animation:
                playRingOuter
                2.2s
                ease-out
                infinite;

            animation-delay:
                0.85s;
        }


        @keyframes playRing {
            0% {
                transform:
                    scale(0.82);

                opacity: 0.95;
            }

            100% {
                transform:
                    scale(1.38);

                opacity: 0;
            }
        }


        @keyframes playRingOuter {
            0% {
                transform:
                    scale(0.85);

                opacity: 0.70;
            }

            100% {
                transform:
                    scale(1.32);

                opacity: 0;
            }
        }


        #startBtn:hover {
            transform:
                scale(1.08);

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255, 255, 255, 0.16),
                    rgba(255, 51, 204, 0.25) 40%,
                    rgba(255, 51, 204, 0.06) 100%
                );

            box-shadow:
                0 0 35px
                rgba(255, 51, 204, 0.45),
                0 0 70px
                rgba(255, 51, 204, 0.12),
                inset 0 0 25px
                rgba(255, 51, 204, 0.10);
        }


        #startBtn:active {
            transform:
                scale(0.96);
        }


        /* =========================================================
           INTRO STATUS
        ========================================================= */

        #introStatus {
            display: none;

            margin-top: 22px;

            color:
                rgba(255, 255, 255, 0.82);

            font-size: 13px;

            letter-spacing: 3px;

            text-transform:
                uppercase;

            animation:
                statusPulse
                1.5s
                ease-in-out
                infinite;
        }


        @keyframes statusPulse {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================================================
           INTRO PROGRESS
        ========================================================= */

        #introProgressWrapper {
            display: none;

            width:
                min(
                    300px,
                    75vw
                );

            margin-top: 20px;
        }


        .intro-progress-track {
            width: 100%;

            height: 2px;

            background:
                rgba(255, 255, 255, 0.10);

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 0 12px
                rgba(255, 51, 204, 0.06);
        }


        #introProgress {
            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    rgba(255, 51, 204, 0.65),
                    var(--pink-light)
                );

            box-shadow:
                0 0 10px
                rgba(255, 51, 204, 0.70);

            transition:
                width 0.15s linear;
        }


        /* =========================================================
           SKIP INTRO
        ========================================================= */

        #skipIntroBtn {
            display: none;

            margin-top: 18px;

            padding: 8px 15px;

            background:
                transparent;

            border:
                none;

            color:
                rgba(255, 255, 255, 0.55);

            font-family:
                'Unica One',
                Arial,
                sans-serif;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform:
                uppercase;

            cursor:
                pointer;

            transition:
                color 0.25s ease,
                transform 0.25s ease;

            animation:
                skipPulse
                1.6s
                ease-in-out
                infinite;
        }


        @keyframes skipPulse {
            0%,
            100% {
                opacity: 0.45;

                text-shadow:
                    0 0 0
                    transparent;

                transform:
                    translateX(0);
            }

            50% {
                opacity: 1;

                color:
                    rgba(255, 255, 255, 0.95);

                text-shadow:
                    0 0 10px
                    rgba(255, 51, 204, 0.55),
                    0 0 22px
                    rgba(255, 51, 204, 0.30);

                transform:
                    translateX(2px);
            }
        }


        #skipIntroBtn:hover {
            color:
                rgba(255, 255, 255, 0.95);

            transform:
                translateX(4px);

            animation: none;

            text-shadow:
                0 0 12px
                rgba(255, 51, 204, 0.60);
        }


        /* =========================================================
           BOTTOM TEXT
        ========================================================= */

        .intro-bottom {
            position: absolute;

            bottom: 28px;

            left: 0;
            right: 0;

            z-index: 5;

            text-align:
                center;

            color:
                rgba(255, 255, 255, 0.22);

            font-family:
                Arial,
                sans-serif;

            font-size: 9px;

            letter-spacing: 4px;

            text-transform:
                uppercase;

            animation:
                bottomFade
                4s
                ease-in-out
                infinite;
        }


        @keyframes bottomFade {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 0.85;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .intro-glow {
                width: 400px;
                height: 400px;
            }

            .intro-logo-wrapper {
                width: 150px;
                height: 150px;

                margin-bottom: 25px;
            }

            .intro-logo {
                width: 110px;
                height: 110px;
            }

            .intro-station {
                font-size: 29px;

                letter-spacing: 5px;

                padding-left: 5px;
            }

            .intro-live {
                font-size: 10px;

                letter-spacing: 3px;

                margin-bottom: 28px;

                padding: 6px 12px;
            }

            .intro-equalizer {
                margin-bottom: 28px;
            }

            #startBtn {
                width: 74px;
                height: 74px;

                font-size: 22px;
            }

            .intro-bottom {
                bottom: 18px;

                font-size: 8px;

                letter-spacing: 3px;
            }
        }

        /* =========================================================
           LOADING MODAL
        ========================================================= */

        #loadingModal {

            display: none;


            position: fixed;


            top: 0;
            left: 0;


            width: 100%;
            height: 100%;


            background-color:

                rgba(
                    0,
                    0,
                    0,
                    0.85
                );


            z-index: 99999;


            justify-content:
                center;

            align-items:
                center;


            font-family:
                'Unica One',
                sans-serif;

        }


        #loadingModal .modal-box {

            background-color:
                #1a1a1a;


            padding:
                40px 60px;


            border-radius:
                15px;


            border:
                2px solid
                var(--pink);


            text-align:
                center;


            box-shadow:

                0 0 30px
                rgba(
                    255,
                    51,
                    204,
                    0.5
                );

        }


        #loadingModal .modal-title {

            color:
                var(--pink);


            font-size:
                28px;


            margin-bottom:
                20px;

        }


        #loadingModal .modal-text {

            color:
                #ffffff;


            font-size:
                20px;

        }


        #loadingModal .modal-spinner {

            margin-top:
                25px;


            width:
                50px;

            height:
                50px;


            border:
                4px solid
                rgba(
                    255,
                    51,
                    204,
                    0.3
                );


            border-top:
                4px solid
                var(--pink);


            border-radius:
                50%;


            animation:
                spin
                1s
                linear
                infinite;


            margin-left:
                auto;

            margin-right:
                auto;

        }


        @keyframes spin {

            0% {

                transform:
                    rotate(0deg);

            }


            100% {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {


            .intro-glow {

                width: 380px;
                height: 380px;

            }


            .intro-logo-wrapper {

                width: 145px;
                height: 145px;

                margin-bottom: 24px;

            }


            .intro-logo {

                width: 110px;
                height: 110px;

            }


            .intro-station {

                font-size: 30px;

                letter-spacing: 3px;

            }


            .intro-live {

                font-size: 11px;

                letter-spacing: 3px;

                margin-bottom: 28px;

            }


            .intro-equalizer {

                margin-bottom: 28px;

            }


            #startBtn {

                width: 74px;
                height: 74px;

                font-size: 24px;

            }


            .intro-bottom {

                bottom: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         INTRO SCREEN
    ========================================================= -->

    <div id="startOverlay">


        <div class="intro-glow"></div>


        <div class="intro-content">


            <div class="intro-logo-wrapper">

                <div class="intro-logo-ring"></div>

                <img
                    src="intro.png"
                    alt="Radio Live"
                    class="intro-logo"
                >

            </div>


            <div class="intro-station">

                RADIO LIVE

            </div>


            <div class="intro-live">

                <span class="intro-live-dot"></span>

                LIVE RADIO

            </div>


            <div class="intro-equalizer">

                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>
                <span class="eq-bar"></span>

            </div>


            <button
                id="startBtn"
                aria-label="Play Radio"
            >

                ▶

            </button>


            <div id="introStatus">

                INTRO PLAYING

            </div>


            <div id="introProgressWrapper">

                <div class="intro-progress-track">

                    <div id="introProgress"></div>

                </div>

            </div>


            <button id="skipIntroBtn">

                SKIP INTRO →

            </button>


        </div>


        <div class="intro-bottom">

            TURN UP THE VOLUME • LIVE

        </div>


    </div>


    <!-- =========================================================
         INTRO AUDIO
    ========================================================= -->

    <audio
        id="introAudio"
        src="radio spot.mp3"
        preload="auto"
    ></audio>


    <!-- =========================================================
         RADIO PLAYER
    ========================================================= -->

    <div class="player-container">

        <div
            id="player"
            class="lunaaudioplayer"
            style="
                width: 100%;
                height: 100%;
            "
        ></div>

    </div>


    <!-- =========================================================
         LOADING MODAL
    ========================================================= -->

    <div id="loadingModal">

        <div class="modal-box">

            <div class="modal-title">

                Παρακαλώ περιμένετε

            </div>


            <div class="modal-text">

                Φόρτωση live streaming...

            </div>


            <div class="modal-spinner"></div>

        </div>

    </div>


    <script>


        /* =========================================================
           INTRO RESPONSIVE SCALE
           
           Το intro γίνεται scale σαν μία ενιαία μονάδα.
           Δεν υπάρχει scrollbar.
           Δεν αλλάζει το background.
        ========================================================= */

        function resizeIntro() {

            const overlay =
                document.getElementById(
                    "startOverlay"
                );


            const content =
                document.querySelector(
                    ".intro-content"
                );


            if (!overlay || !content) {

                return;

            }


            /*
             * Αφαιρούμε προσωρινά το scale ώστε
             * να πάρουμε τις πραγματικές διαστάσεις.
             */

            content.style.setProperty(
                "--intro-scale",
                "1"
            );


            requestAnimationFrame(
                function () {

                    const viewportWidth =
                        window.innerWidth;


                    const viewportHeight =
                        window.innerHeight;


                    const contentWidth =
                        content.offsetWidth;


                    const contentHeight =
                        content.offsetHeight;


                    if (
                        !contentWidth ||
                        !contentHeight
                    ) {

                        return;

                    }


                    /*
                     * Μικρό περιθώριο ώστε το intro
                     * να μην ακουμπάει στις άκρες.
                     */

                    const availableWidth =
                        viewportWidth * 0.94;


                    const availableHeight =
                        viewportHeight * 0.88;


                    const scaleByWidth =
                        availableWidth /
                        contentWidth;


                    const scaleByHeight =
                        availableHeight /
                        contentHeight;


                    /*
                     * Κρατάμε πάντα το κανονικό μέγεθος
                     * όταν υπάρχει αρκετός χώρος.
                     */

                    const scale =
                        Math.min(
                            1,
                            scaleByWidth,
                            scaleByHeight
                        );


                    content.style.setProperty(
                        "--intro-scale",
                        scale.toFixed(4)
                    );

                }
            );

        }



        /* =========================================================
           RADIO PLAYER
        ========================================================= */

        function startRadioPlayer() {


            if (window.radioStarted) {

                return;

            }


            window.radioStarted = true;


            $("#player").lunaradio({


                userinterface:
                    "big",


               backgroundcolor:
                    "transparent",


                fontcolor:
                    "#ff33cc",


                hightlightcolor:
                    "#ffffff",


                fontname:
                    "Unica One",


                googlefont:
                    "Unica+One&display=swap",


                fontratio:
                    "0.5",


                radioname:
                    "radio live",


                scroll:
                    "true",


                coverimage:
                    "logo.png",


                onlycoverimage:
                    "true",


                coverstyle:
                    "animated",


                usevisualizer:
                    "real",


                visualizertype:
                    "6",


                itunestoken:
                    "1000lIPN",


                metadatatechnic:
                    "ownmetadataurl",


                ownmetadataurl:
                    "",


                metadatainterval:
                    "999999999",


                usestreamcorsproxy:
                    "false",


                streamurl:
                    "https://stream.zeno.fm/x8gduy6xd48uv",


                streamtype:
                    "shoutcast2",


                shoutcastpath:
                    "/stream",


                shoutcastid:
                    "1",


                volume:
                    "100",


                debug:
                    "false",


                autoplay:
                    "true",


                multicolorvisualizer:
                    "true",


                color1:
                    "#66ff33",


                color2:
                    "#3399ff",


                color3:
                    "#ffff00",


                color4:
                    "#cc3300",


                displayliveicon:
                    "true"


            });

        }



        /* =========================================================
           INTRO LOGIC
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const startOverlay =
                    document.getElementById(
                        "startOverlay"
                    );


                const startBtn =
                    document.getElementById(
                        "startBtn"
                    );


                const skipIntroBtn =
                    document.getElementById(
                        "skipIntroBtn"
                    );


                const introStatus =
                    document.getElementById(
                        "introStatus"
                    );


                const introProgressWrapper =
                    document.getElementById(
                        "introProgressWrapper"
                    );


                const introProgress =
                    document.getElementById(
                        "introProgress"
                    );


                const introAudio =
                    document.getElementById(
                        "introAudio"
                    );


                let introStarted = false;



                /* =================================================
                   INITIAL INTRO SIZE
                ================================================= */

                resizeIntro();



                window.addEventListener(
                    "resize",
                    function () {

                        resizeIntro();

                    }
                );


                window.addEventListener(
                    "orientationchange",
                    function () {

                        setTimeout(
                            resizeIntro,
                            100
                        );

                    }
                );



                /* =================================================
                   CLOSE INTRO
                ================================================= */

                function closeIntro() {


                    startOverlay.classList.add(
                        "hide"
                    );


                    setTimeout(
                        function () {


                            startOverlay.style.display =
                                "none";


                        },
                        950
                    );

                }



                /* =================================================
                   START INTRO
                ================================================= */

                function startIntro() {


                    if (introStarted) {

                        return;

                    }


                    introStarted = true;


                    startBtn.style.display =
                        "none";


                    introStatus.style.display =
                        "block";


                    introStatus.textContent =
                        "INTRO PLAYING";


                    introProgressWrapper.style.display =
                        "block";


                    skipIntroBtn.style.display =
                        "block";


                    /*
                     * Το περιεχόμενο μεγάλωσε λόγω
                     * status/progress/skip.
                     * Ξαναϋπολογίζουμε την κλίμακα.
                     */

                    setTimeout(
                        resizeIntro,
                        20
                    );


                    const playPromise =
                        introAudio.play();


                    if (
                        playPromise !==
                        undefined
                    ) {


                        playPromise.catch(
                            function (error) {


                                console.error(
                                    "Αποτυχία αναπαραγωγής intro:",
                                    error
                                );


                                startRadioPlayer();

                                closeIntro();

                            }
                        );

                    }

                }



                /* =================================================
                   PLAY BUTTON
                ================================================= */

                startBtn.addEventListener(
                    "click",
                    function () {

                        startIntro();

                    }
                );



                /* =================================================
                   SKIP INTRO
                ================================================= */

                skipIntroBtn.addEventListener(
                    "click",
                    function () {


                        introAudio.pause();

                        introAudio.currentTime =
                            0;


                        introStatus.textContent =
                            "CONNECTING TO LIVE...";


                        skipIntroBtn.style.display =
                            "none";


                        introProgressWrapper.style.display =
                            "none";


                        resizeIntro();


                        setTimeout(
                            function () {


                                startRadioPlayer();

                                closeIntro();


                            },
                            250
                        );

                    }
                );



                /* =================================================
                   INTRO PLAY
                ================================================= */

                introAudio.addEventListener(
                    "play",
                    function () {


                        introStatus.textContent =
                            "INTRO PLAYING";


                    }
                );



                /* =================================================
                   INTRO PROGRESS
                ================================================= */

                introAudio.addEventListener(
                    "timeupdate",
                    function () {


                        if (

                            introAudio.duration &&

                            isFinite(
                                introAudio.duration
                            )

                        ) {


                            const percentage =

                                (
                                    introAudio.currentTime /
                                    introAudio.duration
                                ) * 100;


                            introProgress.style.width =

                                percentage + "%";

                        }

                    }
                );



                /* =================================================
                   INTRO FINISHED
                ================================================= */

                introAudio.addEventListener(
                    "ended",
                    function () {


                        introProgress.style.width =
                            "100%";


                        introStatus.textContent =
                            "CONNECTING TO LIVE...";


                        skipIntroBtn.style.display =
                            "none";


                        introProgressWrapper.style.display =
                            "none";


                        resizeIntro();


                        setTimeout(
                            function () {


                                startRadioPlayer();

                                closeIntro();


                            },
                            450
                        );

                    }
                );



                /* =================================================
                   INTRO ERROR
                ================================================= */

                introAudio.addEventListener(
                    "error",
                    function () {


                        console.warn(
                            "Το intro δεν βρέθηκε. Εκκίνηση radio."
                        );


                        startRadioPlayer();

                        closeIntro();


                    }
                );

            }
        );



        /* =========================================================
           LOADING MODAL
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const modal =
                    document.getElementById(
                        "loadingModal"
                    );


                let lastState = null;


                setInterval(
                    function () {


                        const preloader =
                            document.getElementById(
                                "playeraudiopreloader"
                            );


                        if (!preloader) {

                            return;

                        }


                        const isVisible =
                            $(preloader).is(
                                ":visible"
                            );


                        if (
                            isVisible &&
                            lastState !== true
                        ) {


                            modal.style.display =
                                "flex";


                            lastState =
                                true;

                        }


                        else if (
                            !isVisible &&
                            lastState !== false
                        ) {


                            modal.style.display =
                                "none";


                            lastState =
                                false;

                        }


                    },
                    150
                );

            }
        );



        /* =========================================================
           ZENO.FM METADATA
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const zenoStationId =
                    "x8gduy6xd48uv";

                const metadataUrl =
                    `https://api.zeno.fm/mounts/metadata/subscribe/${zenoStationId}`;

                let currentTitle = "";

                /*
                 * Reject CSS / HTML / script text that can briefly
                 * appear in the external player before real metadata.
                 */
                function isValidStreamTitle(value) {

                    if (typeof value !== "string") {
                        return false;
                    }

                    const title =
                        value
                            .replace(/\s+/g, " ")
                            .trim();

                    if (!title || title.length > 180) {
                        return false;
                    }

                    const lower =
                        title.toLowerCase();

                    const invalidPatterns = [
                        "<style",
                        "</style",
                        "<script",
                        "</script",
                        "box-sizing:",
                        "background:",
                        "background-color:",
                        "--pink:",
                        "--pink-light:",
                        "--white:",
                        "--bg-overlay-opacity:",
                        "font-family:",
                        "border-box",
                        ":root",
                        "html {",
                        "body {",
                        "color:",
                        "position:",
                        "display:",
                        "padding:",
                        "margin:",
                        "z-index:",
                        "opacity:",
                        "overflow:",
                        "animation:",
                        "linear-gradient(",
                        "radial-gradient("
                    ];

                    if (
                        invalidPatterns.some(
                            function (pattern) {
                                return lower.includes(pattern);
                            }
                        )
                    ) {
                        return false;
                    }

                    if (
                        title.includes("{") ||
                        title.includes("}") ||
                        title.includes("</") ||
                        title.includes("--")
                    ) {
                        return false;
                    }

                    return true;
                }


                function getTitleElements() {

                    return document.querySelectorAll(
                        "#player_texttitle, .playertexttitlespan"
                    );
                }


                function clearPlayerTitle() {

                    getTitleElements().forEach(
                        function (el) {

                            el.textContent = "";

                            el.style.visibility =
                                "hidden";

                            el.style.opacity =
                                "0";

                        }
                    );
                }


                function forceUpdateTitle(title) {

                    if (!isValidStreamTitle(title)) {

                        clearPlayerTitle();

                        return;

                    }

                    const cleanTitle =
                        title
                            .replace(/\s+/g, " ")
                            .trim();

                    currentTitle =
                        cleanTitle;


                    if (
                        window.parent !==
                        window
                    ) {

                        window.parent.postMessage(
                            {
                                type:
                                    "RADIO_TITLE_UPDATE",

                                title:
                                    currentTitle
                            },
                            "*"
                        );

                    }


                    getTitleElements().forEach(
                        function (el) {

                            el.textContent =
                                cleanTitle;

                            el.style.visibility =
                                "visible";

                            el.style.opacity =
                                "1";

                        }
                    );

                }


                /*
                 * Start with an empty title.
                 * The title becomes visible only after
                 * valid Zeno metadata arrives.
                 */
                clearPlayerTitle();


                /* =================================================
                   ZENO EVENT SOURCE
                ================================================= */

                let eventSource = null;


                function connectMetadata() {

                    if (eventSource) {

                        try {
                            eventSource.close();
                        }
                        catch (e) {}

                    }


                    eventSource =
                        new EventSource(
                            metadataUrl
                        );


                    eventSource.onmessage =
                        function (event) {

                            try {

                                const data =
                                    JSON.parse(
                                        event.data
                                    );


                                if (
                                    data &&
                                    isValidStreamTitle(
                                        data.streamTitle
                                    )
                                ) {

                                    const newTitle =
                                        data.streamTitle
                                            .replace(
                                                /\s+/g,
                                                " "
                                            )
                                            .trim();


                                    if (
                                        newTitle !==
                                        currentTitle
                                    ) {

                                        forceUpdateTitle(
                                            newTitle
                                        );

                                    }

                                }

                            }
                            catch (e) {

                                console.error(
                                    "Σφάλμα JSON:",
                                    e
                                );

                            }

                        };


                    eventSource.onerror =
                        function () {

                            try {
                                eventSource.close();
                            }
                            catch (e) {}


                            setTimeout(
                                function () {

                                    connectMetadata();

                                },
                                5000
                            );

                        };

                }


                connectMetadata();


                /* =================================================
                   KEEP TITLE UPDATED
                ================================================= */

                setInterval(
                    function () {

                        /*
                         * If no valid metadata has arrived yet,
                         * keep the title completely hidden.
                         */
                        if (!currentTitle) {

                            clearPlayerTitle();

                            return;

                        }


                        /*
                         * If the external player changes the DOM
                         * temporarily, restore only our valid title.
                         */
                        getTitleElements().forEach(
                            function (el) {

                                if (!el) {
                                    return;
                                }


                                if (
                                    el.textContent.trim() !==
                                    currentTitle
                                ) {

                                    el.textContent =
                                        currentTitle;

                                }


                                el.style.visibility =
                                    "visible";

                                el.style.opacity =
                                    "1";

                            }
                        );

                    },
                    5000
                );

            }
        );

    </script>

</body>

</html>
