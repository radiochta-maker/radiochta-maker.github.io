function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function showLoading(isLive) {
  modalText.textContent = isLive ? "φόρτωση live streaming παρακαλώ περιμένετε" : "Φόρτωση αυτόματης μουσικής...";
  loadingModal.style.display = "flex";
}

function hideLoading() {
  loadingModal.style.display = "none";
}

function resizeCanvas() { 
  canvas.width = window.innerWidth; 
  canvas.height = window.innerHeight; 
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setupAudioNodes() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  drawEqualizer();
  startButtonBreath();
}

function loadFallbackPlaylist() {
  fallbackPlaylist = rawSongs.map(song => {
    let fullUrl = baseUrl + song.file;
    songTitlesMap[fullUrl] = song.title.replace('.mp3', '');
    return fullUrl;
  });

  if (fallbackPlaylist.length > 0) {
    shuffleArray(fallbackPlaylist);
  }
}

function fixEncoding(str) {
  if (!str) return '';
  try {
    let bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      bytes[i] = str.charCodeAt(i);
    }
    return new TextDecoder('windows-1253').decode(bytes);
  } catch (e) {
    return str;
  }
}

function updateUIWithTitle(titleText) {
  let finalTitle = titleText || originalRadioName;
  if (finalTitle.length > 25) {
    nowPlayingEl.innerHTML = `<span class="scroll-text">${finalTitle}</span>`;
  } else {
    nowPlayingEl.innerHTML = `<span class="static-text">${finalTitle}</span>`;
  }
  
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'RADIO_TITLE_UPDATE', title: finalTitle }, '*');
  }
}

async function checkStreamStatus() {
  if (isIntroActive) return;
  
  try {
    const response = await fetch(STATUS_URL + '&_=' + Date.now());
    const data = await response.json();
    
    let online = false;
    if (data && data.icestats) {
      let sourceData = data.icestats.source;
      if (Array.isArray(sourceData)) {
        sourceData = sourceData.find(s => s.listenurl && s.listenurl.includes('trela233')) || sourceData[0];
      }
      if (sourceData) {
        online = true;
        if (!isPlayingAuto) {
          let title = sourceData.title ? fixEncoding(sourceData.title) : originalRadioName;
          updateUIWithTitle(title);
        }
      }
    }
    
    if (online !== isLiveOnline) {
      isLiveOnline = online;
      handleStreamStateChange();
    }
  } catch (e) {
    if (isLiveOnline !== false) {
      isLiveOnline = false;
      handleStreamStateChange();
    }
  }
}

function handleStreamStateChange() {
  if (isPlaying && !isIntroActive) {
    if (isLiveOnline) {
      switchToLive();
    } else {
      switchToFallback();
    }
  }
}

function switchToLive() {
  isPlayingAuto = false;
  lastMode = "live";
  statusEl.textContent = "ON AIR Radio Erotiko";
  statusEl.className = "onair";
  
  playlistControls.classList.remove('show');
  progressContainer.classList.remove('show');
  
  showLoading(true);
  audio.pause();
  audio.src = LIVE_URL;
  audio.load();
  
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.then(() => {
      setTimeout(hideLoading, 2000);
    }).catch(err => {
      console.error("Σφάλμα αναπαραγωγής Live:", err);
      hideLoading();
      switchToFallback();
    });
  }
  
  setTimeout(hideLoading, 5000);
}

function switchToFallback() {
  isPlayingAuto = true;
  lastMode = "fallback";
  statusEl.textContent = "ON AIR (Auto DJ)";
  statusEl.className = "fallback";
  
  playlistControls.classList.add('show');
  progressContainer.classList.add('show');
  updatePlaylistPlayPauseBtn();
  
  if (fallbackPlaylist.length > 0) {
    playTrackAtIndex(currentTrackIndex);
  } else {
    updateUIWithTitle("Μη διαθέσιμη αυτόματη μουσική");
    hideLoading();
  }
}

function playTrackAtIndex(index) {
  if (!isPlayingAuto || fallbackPlaylist.length === 0) return;
  
  currentTrackIndex = (index + fallbackPlaylist.length) % fallbackPlaylist.length;
  const trackUrl = fallbackPlaylist[currentTrackIndex];
  
  showLoading(false);
  audio.src = trackUrl;
  
  const displayTitle = songTitlesMap[trackUrl] || decodeURIComponent(trackUrl.split('/').pop().replace('.mp3', '').replace(/_/g, ' '));
  updateUIWithTitle(displayTitle);
  
  progressBar.value = 0;
  currentTimeEl.textContent = "0:00";
  totalTimeEl.textContent = "0:00";
  
  audio.play().then(() => {
    isPlaying = true;
    btn.textContent = "Pause";
    updatePlaylistPlayPauseBtn();
  }).catch(() => {
    currentTrackIndex = (currentTrackIndex + 1) % fallbackPlaylist.length;
    playTrackAtIndex(currentTrackIndex);
  });
}

function playNextFallbackTrack() {
  if (!isPlayingAuto || fallbackPlaylist.length === 0) return;
  playTrackAtIndex(currentTrackIndex + 1);
}

function playPrevFallbackTrack() {
  if (!isPlayingAuto || fallbackPlaylist.length === 0) return;
  playTrackAtIndex(currentTrackIndex - 1);
}

function updatePlaylistPlayPauseBtn() {
  if (audio.paused) {
    playlistPlayPauseBtn.textContent = "▶";
    playlistPlayPauseBtn.title = "Play";
  } else {
    playlistPlayPauseBtn.textContent = "⏸";
    playlistPlayPauseBtn.title = "Παύση";
  }
}

function formatTime(seconds) {
  if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function updateProgress() {
  if (!isPlayingAuto || isSeeking) return;
  
  const current = audio.currentTime;
  const duration = audio.duration;
  
  if (duration && isFinite(duration)) {
    progressBar.value = (current / duration) * 100;
    currentTimeEl.textContent = formatTime(current);
    totalTimeEl.textContent = formatTime(duration);
  }
}

setInterval(updateProgress, 200);

const effects = [
  (ctx, data, w, h) => {
    const barWidth = (w / bufferLength) * 2.5;
    let x = 0;
    for(let i = 0; i < bufferLength; i++){
      const barHeight = data[i] * 0.65;
      ctx.fillStyle = `hsla(${(i * 5 + barHeight) % 360}, 100%, ${50 + barHeight / 5}%, 0.4)`;
      ctx.fillRect(x, h - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  },
  (ctx, data, w, h) => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, w, h);
    let total = 0;
    for(let i = 0; i < bufferLength; i++) total += data[i];
    const avg = total / bufferLength / 255;
    const starCount = 80 + Math.floor(avg * 200);
    const time = Date.now() * 0.002;
    for(let i = 0; i < starCount; i++){
      const x = (i * 131.7 + time * 50) % w;
      const y = (i * 89.3 + time * 30) % h;
      const size = 1 + Math.sin(time * 5 + i) * avg * 4;
      const opacity = 0.4 + avg * 0.6;
      const hue = (i * 7 + time * 100) % 360;
      ctx.shadowBlur = 15 + avg * 25;
      ctx.shadowColor = `hsla(${hue}, 100%, 80%, ${opacity})`;
      ctx.fillStyle = `hsla(${hue}, 100%, 95%, ${opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.clearRect(0,0,w,h);
      const centerX = w / 2;
      const centerY = h / 2;
      const baseRadius = Math.min(centerX, centerY) * 0.1;
      const maxRadius = Math.min(centerX, centerY) * 1.5;
      for (let i = 0; i < bufferLength; i += 2) {
          const value = data[i];
          const radius = baseRadius + (maxRadius - baseRadius) * (value / 255);
          const hue = (i * 10) % 360;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.1)`;
          ctx.lineWidth = 2 + (value / 50);
          ctx.stroke();
      }
  },
  (ctx, data, w, h) => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, w, h);
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      const sliceWidth = w * 1.0 / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
          const value = data[i];
          const y = (value / 128.0) * (h / 4) + (h / 2); 
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height / 2);
      let total = 0;
      for(let i=0; i<bufferLength; i++) total += data[i];
      const avg = total / bufferLength;
      const hue = (avg * 2) % 360;
      ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.5)`;
      ctx.stroke();
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, w, h);
      const centerX = w / 2;
      const centerY = h / 2;
      for(let i=0; i<bufferLength; i += 4) {
          const value = data[i];
          const angle = (i / bufferLength) * Math.PI * 2;
          const time = Date.now() * 0.001;
          const distance = 100 + value * (2 + Math.sin(time + i*0.1));
          const x = centerX + Math.cos(angle) * distance;
          const y = centerY + Math.sin(angle) * distance;
          const size = 2 + value / 20;
          const hue = (i * 15 + time * 50) % 360;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.6)`;
          ctx.shadowBlur = size * 2;
          ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.4)`;
          ctx.fill();
      }
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => { ctx.clearRect(0,0,w,h); }
];
let currentEffect = 3;
const effectNames = ["Bars", "★ Stars", "Circles", "Wave", "Particles", "OFF"];

function drawEqualizer() {
  requestAnimationFrame(drawEqualizer);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  effects[currentEffect](ctx, dataArray, canvas.width, canvas.height);
}

effectBtn.addEventListener('click', () => {
  currentEffect = (currentEffect + 1) % effects.length;
  effectBtn.textContent = effectNames[currentEffect] + " 👆";
});

volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
  volumeValue.textContent = `${volumeSlider.value}%`;
});

audio.addEventListener('ended', () => {
  if (isIntroActive) {
    isIntroActive = false;
    skipBtn.style.display = "none";
    if (isLiveOnline) switchToLive();
    else switchToFallback();
  } else if (isPlayingAuto) {
    playNextFallbackTrack();
  } else if (!isPlayingAuto) {
    switchToFallback();
  }
});

audio.addEventListener('error', () => { 
  hideLoading();
  if (isIntroActive) {
    isIntroActive = false;
    skipBtn.style.display = "none";
    if (isLiveOnline) switchToLive();
    else switchToFallback();
  } else if (!isPlayingAuto) {
    switchToFallback();
  }
});

audio.addEventListener('playing', () => {
  hideLoading();
  updatePlaylistPlayPauseBtn();
});
audio.addEventListener('pause', updatePlaylistPlayPauseBtn);
audio.addEventListener('canplay', () => setTimeout(hideLoading, 280));
audio.addEventListener('loadedmetadata', () => {
  if (isPlayingAuto && audio.duration) {
    totalTimeEl.textContent = formatTime(audio.duration);
  }
});

async function startIntro() {
  isIntroActive = true;
  hasIntroPlayed = true;
  setupAudioNodes();
  audio.src = INTRO_URL;
  statusEl.textContent = "Παίζει Intro...";
  statusEl.className = "loading";

  progressContainer.classList.remove('show');

    await audio.play();
    isPlaying = true;
    btn.textContent = "Pause";
  } catch(e) {

btn.addEventListener('click', async () => {
  if (loadingModal.style.display === "flex") return;
  
  setupAudioNodes();
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  if (isPlaying) {
    audio.pause();
    btn.textContent = "Play";
    statusEl.textContent = "Παύση";
    statusEl.className = "offair";
    isPlaying = false;
    skipBtn.style.display = "none";
    updatePlaylistPlayPauseBtn();
  } else {
    isPlaying = true;
    btn.textContent = "Pause";
    
    if (!hasIntroPlayed) {
      startIntro();
    } else {
      await checkStreamStatus();
      
      if (isLiveOnline) {
        switchToLive();
      } else {
        if (lastMode === "fallback") {
          statusEl.textContent = "ON AIR (Auto DJ)";
          statusEl.className = "fallback";
          playlistControls.classList.add('show');
          progressContainer.classList.add('show');
          audio.play().catch(console.error);
          updatePlaylistPlayPauseBtn();
        } else {
          switchToFallback();
        }
      }
    }
  }
});

skipBtn.addEventListener('click', () => {
  isIntroActive = false;
  skipBtn.style.display = "none";
  if (isLiveOnline) switchToLive();
  else switchToFallback();
});

prevBtn.addEventListener('click', () => {
  if (isPlayingAuto) playPrevFallbackTrack();
});

nextBtn.addEventListener('click', () => {
  if (isPlayingAuto) playNextFallbackTrack();
});

playlistPlayPauseBtn.addEventListener('click', async () => {
  if (!isPlayingAuto) return;
  
  if (audio.paused) {
    try {
      await audio.play();
      isPlaying = true;
      btn.textContent = "Pause";
      statusEl.textContent = "ON AIR (Auto DJ)";

      console.error(e);

    audio.pause();
    isPlaying = false;
    btn.textContent = "Play";
    statusEl.textContent = "Παύση";
    statusEl.className = "offair";

});

progressBar.addEventListener('mousedown', () => { isSeeking = true; });
progressBar.addEventListener('touchstart', () => { isSeeking = true; });

progressBar.addEventListener('input', () => {
  if (!isPlayingAuto || !audio.duration) return;
  const seekTime = (progressBar.value / 100) * audio.duration;
  currentTimeEl.textContent = formatTime(seekTime);
});

progressBar.addEventListener('change', () => {
  if (!isPlayingAuto || !audio.duration) return;
  const seekTime = (progressBar.value / 100) * audio.duration;

});

progressBar.addEventListener('mouseup', () => { isSeeking = false; });

let rotation = 0;
function rotateButton() {
  if (isPlaying) {
    rotation += 0.2;
    visualizerCircle.style.transform = `scale(1.0) rotate(${rotation}deg)`; 
  }
  requestAnimationFrame(rotateButton);
}
requestAnimationFrame(rotateButton);

let _breathRunning = false;
let lastLevel = 0;
function startButtonBreath() {
  if (_breathRunning) return;
  _breathRunning = true;
  
  function step() {
    let boost = 0;
    let targetGlow = 0;
    let musicHue = 174;
    
    if (analyser && dataArray && isPlaying && !audio.paused && (effectNames[currentEffect] !== "OFF")) { 
      analyser.getByteFrequencyData(dataArray);
      let bassSum = 0;
      for (let i = 0; i < 10; i++) bassSum += dataArray[i];
      let averageBass = bassSum / 10;
      let colorOscillation = Math.sin(averageBass * 0.05) * 180 + 180;
      musicHue = Math.floor(174 + colorOscillation) % 360;
      let currentLevel = averageBass / 255;
      let delta = currentLevel - lastLevel;
      if (delta < 0) delta = 0; 
      lastLevel = currentLevel; 
      boost = Math.min(delta * 5, 0.4); 
      targetGlow = Math.min(2.0, averageBass / 50);
      visualizerCircle.style.setProperty('--glow-size', Math.round(targetGlow * 130) + "px");
      visualizerCircle.style.setProperty('--glow-h', musicHue);
    } else {
      visualizerCircle.style.setProperty('--glow-size', "0px");
      visualizerCircle.style.setProperty('--glow-h', "174");
      boost = 0;
    }
    visualizerCircle.style.transform = `scale(${1 + boost}) rotate(${rotation}deg)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

loadFallbackPlaylist();
checkStreamStatus();
setInterval(checkStreamStatus, 10000);
