<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO VIDEO - SYNEFA LIVE</title>
<style>
body {
  margin: 0;
  background: transparent;
  font-family: 'Orbitron', sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  perspective: 1200px;
  overflow: hidden;
}

#player {
  width: 950px; /* Λίγο πιο πλατύ για άνεση */
  height: 550px; /* Λίγο πιο ψηλό για να χωράνε όλα */
  background: rgba(0, 0, 0, 0.85);
  border-radius: 25px;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 100px #ff00ff55;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 0.2s ease;
  position: relative;
}

#halo {
  position: absolute;
  top: -50px; left: -50px;
  width: calc(100% + 100px);
  height: calc(100% + 100px);
  border-radius: 35px;
  pointer-events: none;
  filter: blur(60px);
  opacity: 0.5;
  background: conic-gradient(from 0deg, #ff0055, #00ffff, #ff00ff, #ff0055);
  animation: rotateHalo 20s linear infinite;
}

@keyframes rotateHalo {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

#left {
  width: 32%;
  padding: 15px; /* Μείωση padding για να μην πιέζει τα εσωτερικά στοιχεία */
  border-right: 2px solid #ff00ff55;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between; /* Μοιράζει τα στοιχεία από πάνω μέχρι κάτω ομοιόμορφα */
  z-index: 1;
  box-sizing: border-box;
}

#radio-name { 
  font-size: 19px; 
  font-weight: bold; 
  color: #ffff00; 
  margin: 0; 
  text-align: center;
  white-space: nowrap;
}

#info-top { text-align: center; }
#clock { font-size: 18px; margin-top: 5px; }
#date { font-size: 11px; opacity: 0.7; }

/* ΦΩΤΟΓΡΑΦΙΑ: ΠΑΡΑΜΕΝΕΙ ΣΤΡΟΓΓΥΛΗ */
#mini-cover {
  width: 160px;
  height: 160px;
  min-width: 160px;
  min-height: 160px;
  border-radius: 50%;
  border: 4px solid #ff0055;
  background: url('radio.png') center/cover no-repeat;
  box-shadow: 0 0 30px #ff00ff;
  transition: transform 0.05s linear;
  margin: 10px 0;
}

#track-info { width: 100%; text-align: center; }
#status-display { font-size: 10px; color: #00ffff; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; }
#artist { font-weight: bold; color: #ff0055; font-size: 13px; margin-bottom: 2px; }

#title { 
  font-size: 13px; 
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  height: 18px;
}

.marquee {
  display: inline-block;
  padding-left: 100%;
  animation: marquee-anim 12s linear infinite;
}

@keyframes marquee-anim {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

#equalizer {
  width: 100%;
  height: 60px; /* Πιο χαμηλό για να εξοικονομήσει χώρο */
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
}

.controls { 
  display: flex; 
  gap: 5px; 
  align-items: center; 
  flex-direction: column; 
  width: 100%;
  margin-bottom: 5px;
}

#playBtn {
  padding: 8px 20px;
  background: #ff0055;
  border: none;
  border-radius: 20px;
  color: #ffff00;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #ff0055;
}

#effectBtn, #skipIntroBtn {
  padding: 4px 12px;
  background: rgba(0, 255, 255, 0.15);
  border: 1px solid #00ffff;
  border-radius: 12px;
  color: #00ffff;
  font-size: 10px;
  cursor: pointer;
  margin-top: 2px;
}

#skipIntroBtn { background: #ffff00; color: #000; border: none; display: none; }
#volume { width: 110px; cursor: pointer; margin-top: 5px; }

#right {
  width: 68%;
  display: flex;
}

video {
  width: 100%;
  height: 100%;
  object-fit: fill;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('fonto.jpg');
  background-size: 100% 100%;
  z-index: -1;
}
</style>
</head>
<body>

<div id="player">
  <div id="halo"></div>

  <div id="left">
    <div id="info-top">
      <div id="radio-name">𝓡𝓐𝓓𝓘𝓞 𝓢𝔂𝓷𝓷𝓮𝓯𝓪</div>
      <div id="clock">--:--:--</div>
      <div id="date">--/--/----</div>
    </div>

    <div id="mini-cover"></div>
    
    <div id="track-info">
      <div id="status-display">ΠΑΤΗΣΤΕ PLAY</div>
      <div id="artist">ΦΟΡΤΩΣΗ...</div>
      <div id="title"><span id="track-title">Radio Synnefa Live</span></div>
    </div>

    <canvas id="equalizer"></canvas>

    <div class="controls">
      <button id="playBtn">▶ PLAY</button>
      <div style="display:flex; gap:5px;">
        <button id="effectBtn">Bars</button>
        <button id="skipIntroBtn">SKIP INTRO</button>
      </div>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1.0">
    </div>
  </div>

  <div id="right">
    <video autoplay muted loop playsinline>
      <source src="https://radiochta-maker.github.io/aloo.webm" type="video/mp4">
    </video>
  </div>
</div>

<script>
// --- CONFIGURATION ---
const STREAMS = {
  live: { streamUrl: "https://freestream.hu:8340/trela233", statusUrl: "https://freestream.hu:8340/status-json.xsl?mount=/trela233" },
  backup: { streamUrl: "https://radio.nitro-server.uk/listen/radiotrela/radio.mp3", statusUrl: "https://radio.nitro-server.uk/api/nowplaying/radiotrela" }
};
const INTRO_URL = "https://zantetrelos-cpu.github.io/radiotrela/%CE%A1%CE%AC%CE%B4%CE%B9%CE%BF%20%CE%A3%CF%8D%CE%BD%CE%BD%CE%B5%CF%86%CE%B1.mp3";

const cover = document.getElementById("mini-cover");
const playBtn = document.getElementById("playBtn");
const effectBtn = document.getElementById("effectBtn");
const skipBtn = document.getElementById("skipIntroBtn");
const canvas = document.getElementById("equalizer");
const ctx = canvas.getContext("2d");
const artistEl = document.getElementById("artist");
const titleSpan = document.getElementById("track-title");
const statusDisplay = document.getElementById("status-display");

let audio = new Audio(); audio.crossOrigin = "anonymous";
let audioCtx, analyser, dataArray, playing = false, isLive = true, isIntroActive = false, hasIntroPlayed = false;
let currentEffect = 0;
const effectNames = ["Bars", "★ Stars", "Circles", "Wave", "Particles", "OFF"];

// --- CLOCK ---
setInterval(() => {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("el-GR");
  document.getElementById("date").textContent = now.toLocaleDateString("el-GR");
}, 1000);

// --- EFFECTS ---
const effects = [
  (ctx, data, w, h) => {
    const barWidth = (w / data.length) * 2.5;
    let x = 0;
    for(let i = 0; i < data.length; i++){
      const barHeight = data[i] * 0.3;
      ctx.fillStyle = `hsla(${(i * 5 + Date.now()/50) % 360}, 100%, 50%, 0.8)`;
      ctx.fillRect(x, h - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  },
  (ctx, data, w, h) => {
    let total = 0; for(let i = 0; i < data.length; i++) total += data[i];
    const avg = total / data.length / 255;
    for(let i = 0; i < 40; i++){
      const x = (i * 131.7 + Date.now()/20) % w;
      const y = (i * 89.3 + Date.now()/30) % h;
      ctx.fillStyle = `white`;
      ctx.beginPath(); ctx.arc(x, y, 1 + avg * 3, 0, Math.PI*2); ctx.fill();
    }
  },
  (ctx, data, w, h) => {
      const centerX = w / 2; const centerY = h / 2;
      for (let i = 0; i < data.length; i += 8) {
          const radius = (data[i] / 255) * (h/2);
          ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${(i*10)%360}, 100%, 50%, 0.2)`; ctx.stroke();
      }
  },
  (ctx, data, w, h) => {
      ctx.beginPath(); ctx.moveTo(0, h/2);
      for (let i = 0; i < data.length; i++) {
          const y = (data[i] / 128.0) * (h/4) + (h/4);
          ctx.lineTo(i * (w/data.length), y);
      }
      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
  },
  (ctx, data, w, h) => {
      for(let i=0; i<data.length; i += 12) {
          const x = (i / data.length) * w;
          const y = h - (data[i] / 255) * h;
          ctx.fillStyle = `hsla(${(i*5)%360}, 100%, 70%, 0.6)`;
          ctx.fillRect(x, y, 3, 3);
      }
  },
  (ctx, data, w, h) => { ctx.clearRect(0,0,w,h); }
];

function draw() {
  requestAnimationFrame(draw);
  if (!analyser || !playing) return;
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  effects[currentEffect](ctx, dataArray, canvas.width, canvas.height);

  let bass = 0; for(let i=0; i<10; i++) bass += dataArray[i];
  let avgBass = bass / 10;
  let scale = 1 + (avgBass / 255) * 0.12;
  cover.style.transform = `scale(${scale}) rotate(${Date.now()/60 % 360}deg)`;
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  draw();
}

async function playStream(url, live=true){
  isIntroActive = false; skipBtn.style.display = "none";
  audio.src = url; isLive = live;
  statusDisplay.textContent = "ΣΥΝΔΕΣΗ...";
  try {
    await audio.play();
    playing = true; playBtn.textContent = "⏸ PAUSE";
    statusDisplay.textContent = live ? "ON AIR: LIVE" : "ON AIR: BACKUP";
    setTimeout(fetchTitle, 2000);
  } catch(e){ if(live) playStream(STREAMS.backup.streamUrl, false); }
}

async function startIntro() {
    isIntroActive = true; hasIntroPlayed = true;
    initAudio();
    audio.src = INTRO_URL;
    statusDisplay.textContent = "INTRO...";
    skipBtn.style.display = "block";
    try { await audio.play(); playing = true; playBtn.textContent = "⏸ PAUSE"; } 
    catch(e) { playStream(STREAMS.live.streamUrl, true); }
}

async function fetchTitle() {
  if(!playing || isIntroActive) return;
  const url = isLive ? STREAMS.live.statusUrl : STREAMS.backup.statusUrl;
  try {
    const r = await fetch(url + "?t=" + Date.now());
    const data = await r.json();
    if (isLive && data.icestats?.source) {
       const src = Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source;
       artistEl.textContent = "Radio Synnefa";
       titleSpan.textContent = src.title || "Live";
    } else if (!isLive && data.now_playing) {
       artistEl.textContent = data.now_playing.song.artist;
       titleSpan.textContent = data.now_playing.song.title;
    }
    titleSpan.className = titleSpan.textContent.length > 20 ? "marquee" : "";
  } catch(e) {}
}

playBtn.onclick = () => {
  if (!playing) {
    if (!hasIntroPlayed) startIntro();
    else { initAudio(); playStream(isLive ? STREAMS.live.streamUrl : STREAMS.backup.streamUrl, isLive); }
  } else {
    audio.pause(); playing = false; playBtn.textContent = "▶ PLAY";
    statusDisplay.textContent = "PAUSED";
  }
};

effectBtn.onclick = () => {
  currentEffect = (currentEffect + 1) % effects.length;
  effectBtn.textContent = effectNames[currentEffect];
};

skipBtn.onclick = () => playStream(STREAMS.live.streamUrl, true);
document.getElementById("volume").oninput = (e) => audio.volume = e.target.value;
audio.onended = () => { if(isIntroActive) playStream(STREAMS.live.streamUrl, true); };

document.addEventListener("mousemove", e => {
  const x = (window.innerWidth / 2 - e.clientX) / 60;
  const y = (window.innerHeight / 2 - e.clientY) / 60;
  document.getElementById("player").style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
