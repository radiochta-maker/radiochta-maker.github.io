<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ράδιο Σύννεφα TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            background-image: url('https://i.imgur.com/1MdMJho.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .player-fullscreen {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        iframe, .live-video-element, .backup-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            object-fit: cover;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        iframe { z-index: 1; }
        .live-video-element { z-index: 1; }
        .backup-video { z-index: 1; }

        .show-live-vdo iframe { z-index: 3; opacity: 1; }
        .show-live-hls #hlsPlayer { z-index: 3; opacity: 1; }
        .show-live-picarto #picartoPlayer { z-index: 3; opacity: 1; }
        .show-backup .backup-video { z-index: 3; opacity: 1; }

        .show-live-vdo, .show-live-hls, .show-live-picarto { background-image: none !important; }
        .show-loading iframe, .show-loading .live-video-element, .show-loading .backup-video { opacity: 0; z-index: 1; }

        .mouse-tracker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            padding-left: 30px;
            padding-bottom: 20px;
            pointer-events: none; 
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 10;
            gap: 15px;
        }

        .player-controls.visible { opacity: 1; }

        .fullscreen-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 0 24px;
            height: 48px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
        }

        .live-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 15;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            z-index: 100;
            display: none; 
            text-transform: uppercase;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            animation: blinker 1.2s cubic-bezier(.5, 0, 1, 1) infinite alternate;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes blinker {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.2; transform: scale(0.8); }
        }

        .show-live-vdo .live-badge, 
        .show-live-hls .live-badge, 
        .show-live-picarto .live-badge { 
            display: flex; 
        }
    </style>
</head>
<body class="show-loading"> 
    <div class="player-fullscreen" id="mainContainer">
        <div class="live-badge">ΖΩΝΤΑΝΑ ΤΩΡΑ</div>

        <div id="noticeMessage" class="live-notice">
            Ράδιο Σύννεφα TV | Live Streaming.<br>Παρακαλούμε περιμένετε... Γίνεται φόρτωση του stream.
        </div>

        <div class="mouse-tracker" id="tracker"></div>

        <video id="backupVideo" class="backup-video" src="https://res.cloudinary.com/dtiuiw8sp/video/upload/v1778706107/spot_radio_sinefa_tv_xatuhk.mp4" muted playsinline></video>

        <iframe id="vdoPlayer" 
                src="https://vdo.ninja/?view=SiDsgNa&cleanoutput&transparent&autoplay&api=1" 
                allow="autoplay; autofocus; encrypted-media">
        </iframe>

        <video id="hlsPlayer" class="live-video-element" muted playsinline></video>

        <video id="picartoPlayer" class="live-video-element" src="https://edge1-eu-west.picarto.tv/stream/golive%2bzakynthos.mp4" muted playsinline></video>

        <div class="player-controls" id="playerControls">
            <div class="volume-container">
                <span id="volumeIcon">🔈</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="0">
            </div>
            
            <button id="fsToggle" class="fullscreen-btn">
                <span id="fsIcon">📺</span> <span id="fsText">Πλήρης Οθόνη</span>
            </button>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('vdoPlayer');
        const hlsPlayer = document.getElementById('hlsPlayer');
        const picartoPlayer = document.getElementById('picartoPlayer');
        const backupVideo = document.getElementById('backupVideo');
        const controls = document.getElementById('playerControls');
        const tracker = document.getElementById('tracker');
        const container = document.getElementById('mainContainer');
        const notice = document.getElementById('noticeMessage');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const fsButton = document.getElementById('fsToggle');
        const fsIcon = document.getElementById('fsIcon');
        const fsText = document.getElementById('fsText');

        let hideTimeout;
        const HIDE_DELAY_MS = 3000; 
        let currentMode = "loading";
        let lastMessageTime = Date.now();
        let isFirstLoad = true; 

        let isVdoActive = false;
        let isHlsActive = false;
        let isPicartoActive = false;

        // Μεταβλητές για τον έλεγχο παγώματος χρόνου του Picarto
        let lastPicartoTime = -1;
        let picartoFreezeCounter = 0;

        const m3u8Url = "https://lbgo.bozztv.com/ssh101/ssh101/radiotvtrela/playlist.m3u8";
        let hlsInstance = null;

        const playlist = [
            "https://res.cloudinary.com/dtiuiw8sp/video/upload/v1778706107/spot_radio_sinefa_tv_xatuhk.mp4", 
            "https://res.cloudinary.com/dtiuiw8sp/video/upload/v1778689946/dokimisakis_rouvlp.mp4",        
            "https://res.cloudinary.com/dtiuiw8sp/video/upload/v1756023318/spot2_djefej.mp4",                
            "https://res.cloudinary.com/dtiuiw8sp/video/upload/v1755723079/download_l6ccgd.mp4",             
            "https://video.gumlet.io/676da5bee52b1079305dbcd3/677839eaabb26867fdbf5938/download.mp4",       
            "https://video.gumlet.io/676da5bee52b1079305dbcd3/67dc0c9d4c720203cbdded25/download.mp4"         
        ];
        let currentVideoIndex = 0;

        backupVideo.addEventListener('ended', function() {
            currentVideoIndex++;
            if (currentVideoIndex >= playlist.length) { currentVideoIndex = 0; }
            backupVideo.src = playlist[currentVideoIndex];
            if (currentMode === "backup") {
                backupVideo.play().catch(e => console.log(e));
            }
        });

        function showControls() {
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(function() { controls.classList.remove('visible'); }, HIDE_DELAY_MS);
        }

        tracker.addEventListener('mousemove', showControls);
        controls.addEventListener('mousemove', showControls);
        container.addEventListener('mousemove', showControls);
        showControls();

        setTimeout(function() { notice.style.opacity = "0"; }, 7000);

        function sendVdoCommand(command, value) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ [command]: value }, '*');
            }
        }

        function initHlsPlayer() {
            if (Hls.isSupported()) {
                if (hlsInstance) { hlsInstance.destroy(); }
                hlsInstance = new Hls({
                    manifestLoadingTimeOut: 4000,
                    manifestLoadingMaxRetry: 1,
                    liveDurationInfinity: true
                });
                hlsInstance.loadSource(m3u8Url);
                hlsInstance.attachMedia(hlsPlayer);
                
                hlsInstance.on(Hls.Events.FRAG_CHANGED, function() {
                    isHlsActive = true;
                    evaluateStreamPriority();
                });

                hlsInstance.on(Hls.Events.ERROR, function() {
                    isHlsActive = false;
                    evaluateStreamPriority();
                });
            }
        }

        iframe.addEventListener('load', function() {
            sendVdoCommand('mute', true);
            initHlsPlayer();
            picartoPlayer.play().catch(() => {});
        });

        window.addEventListener('message', function(e) {
            if (!e.data) return;
            lastMessageTime = Date.now();

            if (e.data.action === 'video-loaded' || e.data.event === 'wfs-video-loaded' || e.data.streamID) {
                isVdoActive = true;
                evaluateStreamPriority();
            }

            if (e.data.action === 'stream-dropped' || e.data.event === 'video-removed' || e.data.action === 'stopped') {
                isVdoActive = false;
                evaluateStreamPriority();
            }
        });

        // Σήμα έναρξης Picarto
        picartoPlayer.addEventListener('playing', function() {
            isPicartoActive = true;
            picartoFreezeCounter = 0; 
            evaluateStreamPriority();
        });

        picartoPlayer.addEventListener('error', function() {
            isPicartoActive = false;
            evaluateStreamPriority();
        });

        // ΣΚΛΗΡΟΣ ΕΛΕΓΧΟΣ ΠΑΓΩΜΑΤΟΣ (Κάθε 1 δευτερόλεπτο)
        setInterval(function() {
            if (currentMode === "live-picarto") {
                // Αν ο τρέχων χρόνος του βίντεο είναι ο ίδιος με τον προηγούμενο, σημαίνει ότι πάγωσε
                if (picartoPlayer.currentTime === lastPicartoTime) {
                    picartoFreezeCounter++;
                    // Αν μείνει παγωμένο για 3 συνεχόμενα δευτερόλεπτα
                    if (picartoFreezeCounter >= 3) {
                        isPicartoActive = false;
                        picartoFreezeCounter = 0;
                        evaluateStreamPriority(); // Αναγκαστική αλλαγή ροής
                    }
                } else {
                    picartoFreezeCounter = 0; // Το βίντεο προχωράει κανονικά
                }
                lastPicartoTime = picartoPlayer.currentTime;
            }
        }, 1000);

        function evaluateStreamPriority() {
            if (isVdoActive) {
                if (currentMode !== "live-vdo") {
                    currentMode = "live-vdo";
                    document.body.className = "show-live-vdo";
                    backupVideo.pause();
                    hlsPlayer.pause();
                    picartoPlayer.pause();
                    isFirstLoad = false;
                }
                return;
            }

            if (isHlsActive) {
                if (currentMode !== "live-hls") {
                    currentMode = "live-hls";
                    document.body.className = "show-live-hls";
                    backupVideo.pause();
                    picartoPlayer.pause();
                    hlsPlayer.play().catch(() => {});
                    isFirstLoad = false;
                }
                return;
            }

            if (isPicartoActive) {
                if (currentMode !== "live-picarto") {
                    currentMode = "live-picarto";
                    document.body.className = "show-live-picarto";
                    backupVideo.pause();
                    hlsPlayer.pause();
                    picartoPlayer.play().catch(() => {});
                    isFirstLoad = false;
                }
                return;
            }

            if (currentMode !== "backup") {
                document.body.className = "show-loading";
                switchToBackup();
            }
        }

        function switchToBackup() {
            currentMode = "backup";
            document.body.className = "show-backup";
            hlsPlayer.pause();
            picartoPlayer.pause();

            if (isFirstLoad) {
                currentVideoIndex = 0;
                backupVideo.src = playlist[0];
                isFirstLoad = false; 
            } else {
                const randomIndex = Math.floor(Math.random() * playlist.length);
                currentVideoIndex = randomIndex;
                backupVideo.src = playlist[currentVideoIndex];
            }

            backupVideo.play().catch(err => console.log("Autoplay block:", err));
        }

        setTimeout(function() {
            if (currentMode === "loading" && !isVdoActive && !isHlsActive && !isPicartoActive) {
                switchToBackup();
            }
        }, 3500);

        setInterval(function() {
            if (currentMode === "live-vdo") {
                sendVdoCommand('get_state', true);
                if (Date.now() - lastMessageTime > 4000) {
                    isVdoActive = false;
                    evaluateStreamPriority();
                }
            }
        }, 2000);

        setInterval(function() {
            if (!isVdoActive && currentMode === "backup") {
                initHlsPlayer();
                picartoPlayer.load();
                picartoPlayer.play().catch(() => {});
            }
        }, 12000);

        volumeSlider.addEventListener('input', function(e) {
            e.stopPropagation();
            showControls();
            const volumeValue = volumeSlider.value;
            const volumeRatio = volumeValue / 100;

            if (volumeValue > 0) {
                sendVdoCommand('mute', false);
                sendVdoCommand('volume', volumeRatio);
                
                backupVideo.muted = false;
                backupVideo.volume = volumeRatio;

                hlsPlayer.muted = false;
                hlsPlayer.volume = volumeRatio;

                picartoPlayer.muted = false;
                picartoPlayer.volume = volumeRatio;
                
                if (volumeValue < 40) volumeIcon.textContent = "🔈";
                else if (volumeValue < 80) volumeIcon.textContent = "🔉";
                else volumeIcon.textContent = "🔊";
            } else {
                sendVdoCommand('mute', true);
                backupVideo.muted = true;
                hlsPlayer.muted = true;
                picartoPlayer.muted = true;
                volumeIcon.textContent = "🔇";
            }
        });

        volumeSlider.addEventListener('click', function(e) { e.stopPropagation(); });

        fsButton.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(err.message));
            } else {
                document.exitFullscreen();
            }
            showControls();
        });

        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                fsIcon.textContent = "🔄";
                fsText.textContent = "Έξοδος από Πλήρη Οθόνη";
            } else {
                fsIcon.textContent = "📺";
                fsText.textContent = "Πλήρης Οθόνη";
            }
        });
    </script>
</body>
</html>
