<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ράδιο Γαρύφαλλο</title>
    
    <script src="jquery-3.2.1.min.js"></script>
    <script src="nativeflashradiov4.js"></script>
    
    <style>
        :root {
            --bg-overlay-opacity: 0.6; 
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, var(--bg-overlay-opacity));
            z-index: -1;
            pointer-events: none;
        }
        
        .player-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #player_texttitle, .playertexttitlespan {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        #player_texttitle {
            font-size: 26px !important; 
        }

        .playertexttitlespan {
            font-size: 34px !important; 
            margin-top: 5px !important;
        }

        /* Modal styles */
        #loadingModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            font-family: 'Unica One', sans-serif;
        }

        #loadingModal .modal-box {
            background-color: #1a1a1a;
            padding: 40px 60px;
            border-radius: 15px;
            border: 2px solid #ff33cc;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 51, 204, 0.5);
        }

        #loadingModal .modal-title {
            color: #ff33cc;
            font-size: 28px;
            margin-bottom: 20px;
        }

        #loadingModal .modal-text {
            color: #ffffff;
            font-size: 20px;
        }

        #loadingModal .modal-spinner {
            margin-top: 25px;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 51, 204, 0.3);
            border-top: 4px solid #ff33cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player-container"> 
        <div id="player" class="lunaaudioplayer" style="width: 100%; height: 100%;">
            <script>
                $(document).ready(function() {
                    $("#player").lunaradio({
                        userinterface: "big", 
                        backgroundcolor: "transparent",
                        fontcolor: "#ff33cc",
                        hightlightcolor: "#ffffff", 
                        fontname: "Unica One", 
                        googlefont: "Unica+One&display=swap", 
                        fontratio: "0.5", 
                        radioname: "Ράδιο Γαρύφαλλο LIVE", 
                        scroll: "true", 
                        coverimage: "logo.png",
                        onlycoverimage: "true",
                        coverstyle: "animated",
                        usevisualizer: "real", 
                        visualizertype: "6", 
                        itunestoken: "1000lIPN", 
                        metadatatechnic: "ownmetadataurl",
                        ownmetadataurl: "",
                        metadatainterval: "999999999",
                        usestreamcorsproxy: "false",
                        streamurl: "https://stream.zeno.fm/x8gduy6xd48uv", 
                        streamtype: "shoutcast2", 
                        shoutcastpath: "/stream",
                        shoutcastid: "1", 
                        volume: "100",
                        debug: "false",
                        autoplay: "false",
                        multicolorvisualizer: "true",
                        color1: "#66ff33",
                        color2: "#3399ff",
                        color3: "#ffff00",
                        color4: "#cc3300",
                        displayliveicon: "true"
                    });
                });
            </script>
        </div>
    </div>

    <!-- MODAL -->
    <div id="loadingModal">
        <div class="modal-box">
            <div class="modal-title">Παρακαλώ περιμένετε</div>
            <div class="modal-text">Φόρτωση live streaming...</div>
            <div class="modal-spinner"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const modal = document.getElementById('loadingModal');
            let lastState = null;

            // Έλεγχος κάθε 150ms αν ο κύκλος φόρτωσης του player είναι ορατός
            setInterval(function() {
                const preloader = document.getElementById('playeraudiopreloader');
                if (!preloader) return;

                // Έλεγχος αν είναι ορατός (jQuery fadeOut βάζει display:none)
                const isVisible = $(preloader).is(':visible');

                if (isVisible && lastState !== true) {
                    modal.style.display = 'flex';
                    lastState = true;
                } else if (!isVisible && lastState !== false) {
                    modal.style.display = 'none';
                    lastState = false;
                }
            }, 150);
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const zenoStationId = "x8gduy6xd48uv";
            const metadataUrl = `https://api.zeno.fm/mounts/metadata/subscribe/${zenoStationId}`;
            const defaultTitle = "live streaming radio garifalo";
            let currentTitle = defaultTitle;

            function forceUpdateTitle(title) {
                currentTitle = title;
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'RADIO_TITLE_UPDATE', title: currentTitle }, '*');
                }
                const titleElements = document.querySelectorAll('#player_texttitle, .playertexttitlespan');
                titleElements.forEach(el => {
                    if (el) {
                        el.textContent = currentTitle;
                        el.style.display = 'block';
                        el.style.visibility = 'visible';
                    }
                });
            }

            forceUpdateTitle(defaultTitle);

            let eventSource = new EventSource(metadataUrl);
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data && data.streamTitle && data.streamTitle.trim() !== "") {
                        const newTitle = data.streamTitle.trim();
                        if (newTitle !== currentTitle) {
                            forceUpdateTitle(newTitle);
                        }
                    }
                } catch (e) { console.error("Σφάλμα JSON:", e); }
            };

            eventSource.onerror = function() {
                eventSource.close();
                setTimeout(() => { eventSource = new EventSource(metadataUrl); }, 5000);
            };

            setInterval(() => {
                const titleElements = document.querySelectorAll('#player_texttitle, .playertexttitlespan');
                titleElements.forEach(el => {
                    if (el && el.textContent.trim() !== currentTitle) {
                        el.textContent = currentTitle;
                    }
                });
            }, 5000);
        });
    </script>
</body>
</html>
